<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amane Protocol - AWallet Liaison (tive-ai)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; margin: 0; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; max-width: 680px; margin: 0 auto 1.5rem; }
    h1 { color: #58a6ff; font-size: 1.4rem; margin-top: 0; }
    h2 { font-size: 1.1rem; color: #8b949e; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    button { background: #238636; color: #fff; border: none; padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { opacity: 0.9; }
    .btn-blue { background: #1f6feb; }
    .btn-purple { background: #8957e5; }
    pre { background: #090c10; border: 1px solid #30363d; padding: 1rem; border-radius: 6px; overflow-x: auto; color: #7ee787; font-size: 0.85rem; min-height: 120px; white-space: pre-wrap; word-break: break-all; }
    .status { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 12px; background: #238636; color: #fff; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Amane Protocol: AWallet Core <span class="status">LIVE</span></h1>
    <p>Liaison Model (tive-ai) & Autonomous Micro-Settlement</p>
    <p><strong>Smart Account:</strong> <code>0x9136c38A4C49C14a1a5EA73796054E1C6be7aB73</code> (Base Sepolia)</p>
  </div>

  <div class="card">
    <h2>Automation & A2A Skills</h2>
    <div class="btn-group">
      <button onclick="callApi('/balance', {address: '0x9136c38A4C49C14a1a5EA73796054E1C6be7aB73#})">1. 残高照会</button>
      <button class="btn-blue" onclick="callApi('/execute', {to: '0x9136c38A4C49C14a1a5EA73796054E1C6be7aB73', valueEth: '0', data: '0x'})">2. ガスレス送金</button>
      <button class="btn-purple" onclick="callApi('/skills', null, 'GET')">3. スキル一覧</button>
    </div>
    <pre id="output">ボタンをクリックすると API を実行して結果をリアルタイム表示します。</pre>
  </div>

  <script>
    const API_BASE = 'https://awallet-service-291872969988.us-central1.run.app';
    async function callApi(path, body, method = 'POST') {
      const out = document.getElementById('output');
      out.textContent = '定�行中... リクカスト送信中: ' + path;
      try {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        let res = await fetch(API_BASE + path, opts);
        let data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        out.textContent = 'エラー: ' + err.message;
      }
    }
  </script>
</body>
</html>
