steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/gen-lang-client-0917953723/amas-notebook-of-serend-ui-p2p-messaging-video-ch', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/gen-lang-client-0917953723/amas-notebook-of-serend-ui-p2p-messaging-video-ch']

  # Deploy container to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'amas-notebook-of-serend-ui-p2p-messaging-video-ch'
      - '--image'
      - 'gcr.io/gen-lang-client-0917953723/amas-notebook-of-serend-ui-p2p-messaging-video-ch'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/gen-lang-client-0917953723/amas-notebook-of-serend-ui-p2p-messaging-video-ch'
